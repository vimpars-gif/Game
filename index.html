<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AAIB Platinum Challenge</title>
    <!-- Phaser 3 Engine CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b1a30;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<script>
    const config = {
        type: Phaser.AUTO,
        width: 360,
        height: 640,
        parent: 'game-container',
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 350 },
                debug: false
            }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    let player;
    let coins;
    let hazards;
    let score = 0;
    let scoreText;
    let timerText;
    let timeLeft = 30;
    let isGameOver = false;

    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('playerCardAsset', 'aaib_card.png');

        // عناصر النقاط والعوائق
        let coinGraphics = this.make.graphics({x: 0, y: 0, add: false});
        coinGraphics.fillStyle(0xffd700, 1);
        coinGraphics.fillCircle(15, 15, 15);
        coinGraphics.generateTexture('coin', 30, 30);

        let hazardGraphics = this.make.graphics({x: 0, y: 0, add: false});
        hazardGraphics.fillStyle(0xe74c3c, 1);
        hazardGraphics.fillCircle(15, 15, 15);
        hazardGraphics.generateTexture('hazard', 30, 30);
    }

    function create() {
        // مكان الكارت واعتمدنا أبعاد ثابتة للـ Canvas لتفادي الشاشات المخلّة
        player = this.physics.add.sprite(180, 560, 'playerCardAsset');
        
        // تحديد العرض والارتفاع بوضوح (عرض 90px وارتفاع 55px)
        player.setDisplaySize(90, 55);
        
        // ضبط الحدود الفيزيائية لتطابق العرض الجديد
        player.body.setSize(player.width, player.height);
        player.setCollideWorldBounds(true);
        player.body.setAllowGravity(false);

        coins = this.physics.add.group();
        hazards = this.physics.add.group();

        scoreText = this.add.text(16, 20, 'Score: 0', { fontSize: '20px', fill: '#ffffff', fontWeight: 'bold' });
        timerText = this.add.text(220, 20, 'Time: 30s', { fontSize: '20px', fill: '#ffffff', fontWeight: 'bold' });

        // التفاعل بالتاتش
        this.input.on('pointermove', function (pointer) {
            if (!isGameOver) {
                // تحويل إحداثيات التاتش لإحداثيات الكانفاس الداخلية
                let touchX = pointer.x;
                player.x = Phaser.Math.Clamp(touchX, 45, 315);
            }
        });

        this.time.addEvent({
            delay: 650,
            callback: spawnItem,
            callbackScope: this,
            loop: true
        });

        this.time.addEvent({
            delay: 1000,
            callback: updateTimer,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(player, coins, collectCoin, null, this);
        this.physics.add.overlap(player, hazards, hitHazard, null, this);
    }

    function update() {}

    function spawnItem() {
        if (isGameOver) return;

        let x = Phaser.Math.Between(30, 330);
        if (Math.random() < 0.7) {
            let coin = coins.create(x, 0, 'coin');
            coin.setVelocityY(Phaser.Math.Between(180, 260));
        } else {
            let hazard = hazards.create(x, 0, 'hazard');
            hazard.setVelocityY(Phaser.Math.Between(220, 310));
        }
    }

    function collectCoin(player, coin) {
        coin.disableBody(true, true);
        score += 10;
        scoreText.setText('Score: ' + score);
    }

    function hitHazard(player, hazard) {
        hazard.disableBody(true, true);
        score = Math.max(0, score - 15);
        scoreText.setText('Score: ' + score);
    }

    function updateTimer() {
        if (isGameOver) return;

        timeLeft--;
        timerText.setText('Time: ' + timeLeft + 's');

        if (timeLeft <= 0) {
            endGame.call(this);
        }
    }

    function endGame() {
        isGameOver = true;
        this.physics.pause();

        let bg = this.add.rectangle(180, 320, 300, 200, 0x000000, 0.88);
        this.add.text(180, 250, 'GAME OVER!', { fontSize: '22px', fill: '#ffffff', fontWeight: 'bold' }).setOrigin(0.5);
        this.add.text(180, 290, 'Your Score: ' + score, { fontSize: '18px', fill: '#ffd700' }).setOrigin(0.5);

        let ctaButton = this.add.text(180, 340, 'Apply For AAIB Card', { 
            fontSize: '15px', 
            fill: '#0b1a30', 
            backgroundColor: '#ffffff', 
            padding: { x: 12, y: 6 } 
        }).setOrigin(0.5);

        ctaButton.setInteractive({ useHandCursor: true });
        ctaButton.on('pointerdown', () => {
            alert('Redirecting to AAIB Card Application Page...');
        });
    }
</script>

</body>
</html>
