<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AAIB Platinum Challenge</title>
    <!-- Phaser 3 Engine CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1a30;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<script>
    // حساب أبعاد الشاشة الحقيقية للجهاز
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    const config = {
        type: Phaser.AUTO,
        width: screenWidth,
        height: screenHeight,
        parent: 'game-container',
        scale: {
            mode: Phaser.Scale.RESIZE,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: screenHeight * 0.45 }, // تدرج الجاذبية يناسب ارتفاع الشاشة
                debug: false
            }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    let player;
    let coins;
    let hazards;
    let score = 0;
    let scoreText;
    let timerText;
    let timeLeft = 30;
    let isGameOver = false;

    const game = new Phaser.Game(config);

    function preload() {
        this.load.image('playerCardAsset', 'aaib_card.png');

        // أحجام العناصر الهابطة تتناسب مع عرض الشاشة (8% من عرض الشاشة)
        let itemSize = screenWidth * 0.08;

        let coinGraphics = this.make.graphics({x: 0, y: 0, add: false});
        coinGraphics.fillStyle(0xffd700, 1);
        coinGraphics.fillCircle(itemSize / 2, itemSize / 2, itemSize / 2);
        coinGraphics.generateTexture('coin', itemSize, itemSize);

        let hazardGraphics = this.make.graphics({x: 0, y: 0, add: false});
        hazardGraphics.fillStyle(0xe74c3c, 1);
        hazardGraphics.fillCircle(itemSize / 2, itemSize / 2, itemSize / 2);
        hazardGraphics.generateTexture('hazard', itemSize, itemSize);
    }

    function create() {
        // تحديد موضع Y للكارت بنسبة 88% من ارتفاع الشاشة ليكون دايماً فوق الأسفل بمسافة ممتازة
        let playerY = screenHeight * 0.88;
        
        player = this.physics.add.sprite(screenWidth / 2, playerY, 'playerCardAsset');
        
        // جعل عرض الكارت يساوي 22% من عرض الشاشة الحقيقية للموبايل
        let cardTargetWidth = screenWidth * 0.22;
        let scaleFactor = cardTargetWidth / player.width;
        player.setScale(scaleFactor);
        
        player.setCollideWorldBounds(true);
        player.body.setAllowGravity(false);

        coins = this.physics.add.group();
        hazards = this.physics.add.group();

        // نصوص النتيجة والوقت بحجم خط متناسب مع الشاشة
        let fontSize = Math.max(16, Math.floor(screenWidth * 0.045)) + 'px';
        scoreText = this.add.text(16, 20, 'Score: 0', { fontSize: fontSize, fill: '#ffffff', fontWeight: 'bold' });
        timerText = this.add.text(screenWidth - 120, 20, 'Time: 30s', { fontSize: fontSize, fill: '#ffffff', fontWeight: 'bold' });

        // التحريك بالتاتش للـ Pointer
        this.input.on('pointermove', function (pointer) {
            if (!isGameOver) {
                let halfCardWidth = player.displayWidth / 2;
                player.x = Phaser.Math.Clamp(pointer.x, halfCardWidth, screenWidth - halfCardWidth);
            }
        });

        this.time.addEvent({
            delay: 650,
            callback: spawnItem,
            callbackScope: this,
            loop: true
        });

        this.time.addEvent({
            delay: 1000,
            callback: updateTimer,
            callbackScope: this,
            loop: true
        });

        this.physics.add.overlap(player, coins, collectCoin, null, this);
        this.physics.add.overlap(player, hazards, hitHazard, null, this);
    }

    function update() {}

    function spawnItem() {
        if (isGameOver) return;

        let padding = screenWidth * 0.1;
        let x = Phaser.Math.Between(padding, screenWidth - padding);
        let fallSpeed = Phaser.Math.Between(screenHeight * 0.25, screenHeight * 0.4);

        if (Math.random() < 0.7) {
            let coin = coins.create(x, 0, 'coin');
            coin.setVelocityY(fallSpeed);
        } else {
            let hazard = hazards.create(x, 0, 'hazard');
            hazard.setVelocityY(fallSpeed * 1.1);
        }
    }

    function collectCoin(player, coin) {
        coin.disableBody(true, true);
        score += 10;
        scoreText.setText('Score: ' + score);
    }

    function hitHazard(player, hazard) {
        hazard.disableBody(true, true);
        score = Math.max(0, score - 15);
        scoreText.setText('Score: ' + score);
    }

    function updateTimer() {
        if (isGameOver) return;

        timeLeft--;
        timerText.setText('Time: ' + timeLeft + 's');

        if (timeLeft <= 0) {
            endGame.call(this);
        }
    }

    function endGame() {
        isGameOver = true;
        this.physics.pause();

        let boxWidth = screenWidth * 0.85;
        let boxHeight = screenHeight * 0.35;

        let bg = this.add.rectangle(screenWidth / 2, screenHeight / 2, boxWidth, boxHeight, 0x000000, 0.88);
        
        this.add.text(screenWidth / 2, screenHeight / 2 - 40, 'GAME OVER!', { 
            fontSize: (screenWidth * 0.06) + 'px', 
            fill: '#ffffff', 
            fontWeight: 'bold' 
        }).setOrigin(0.5);

        this.add.text(screenWidth / 2, screenHeight / 2, 'Your Score: ' + score, { 
            fontSize: (screenWidth * 0.05) + 'px', 
            fill: '#ffd700' 
        }).setOrigin(0.5);

        let ctaButton = this.add.text(screenWidth / 2, screenHeight / 2 + 50, 'Apply For AAIB Card', { 
            fontSize: (screenWidth * 0.04) + 'px', 
            fill: '#0b1a30', 
            backgroundColor: '#ffffff', 
            padding: { x: 15, y: 8 } 
        }).setOrigin(0.5);

        ctaButton.setInteractive({ useHandCursor: true });
        ctaButton.on('pointerdown', () => {
            alert('Redirecting to AAIB Card Application Page...');
        });
    }
</script>

</body>
</html>
